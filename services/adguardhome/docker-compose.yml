version: "3.8"

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    network_mode: "host"
    restart: unless-stopped

    # Basic hardening. Won't save you from yourself, but helps.
    security_opt:
      - no-new-privileges:true

    # Persist config + runtime data
    volumes:
      - /home/tharding/Docker/adguardhome/work:/opt/adguardhome/work
      - /media/data/configs/adguardhome/conf:/opt/adguardhome/conf

    # Keep logs from exploding forever
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - TZ=America/Los_Angeles

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
      - "82:80/tcp"
      - "449:443/tcp"