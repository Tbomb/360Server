version: "3"
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    ports: 
      - 60000:60000 #port used for torrent connections. make sure it the qBittorrent config port!!!
      - 60000:60000/udp #udp port used for torrent connections. make sure it the qBittorrent config port!!!
      - ${UI_WEBPORT}:${UI_WEBPORT}      
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_CITIES=${SERVER_CITIES}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT}
    volumes:
      - ${GLUETUN_DATA}:/gluetun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
      - WEBUI_PORT=${UI_WEBPORT}
      - DOCKER_MODS=${DOCKER_MODS}
    volumes:
      - ${QBITTORRENT_CONFIG}:/config
      - ${QBITTORRENT_TORRENT_DATA}:/.local
      - ${DOWNLOADS_DATA}:/Downloads
      - ${PLEX_DATA}:/Plex-Media
    network_mode: "service:gluetun" #change gluetun to your VPN container   

    restart: unless-stopped
