services:
  glances:
    image: nicolargo/glances:latest   # Alpine-based, multi-arch (pulls arm64 on Pi 5)
    container_name: glances
    restart: unless-stopped
    pid: host                          # Required to see host processes
    network_mode: host                 # Simplest way to expose port 61208 + see network stats
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Docker container monitoring
      - /etc/os-release:/etc/os-release:ro             # Show host OS info (not container's)
    environment:
      - GLANCES_OPT=-w                 # -w starts the web UI (http://your-pi-ip:61208)
      - TZ=America/Los_Angeles
